<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>813國軍桃園總醫院新竹分院 看診進度提醒 — 設定</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <div>
          <h1>813國軍桃園總醫院新竹分院 看診進度提醒<span class="unofficial">非官方</span></h1>
          <p class="muted small" id="source-line">
            資料來源：
            <a href="http://www.813.com.tw/WebService/link/show_call2.html" target="_blank"
              >看診進度頁面</a
            >
            ・每分鐘自動查詢一次・本工具由個人開發，非醫院官方推出
          </p>
        </div>
        <button id="btn-reload">重新抓取診間清單</button>
      </header>

      <section class="card">
        <h2>通知與更新設定</h2>
        <div class="grid">
          <label class="field">
            <span>更新頻率</span>
            <select id="interval">
              <option value="0.5">每 30 秒</option>
              <option value="1">每 1 分鐘（預設）</option>
              <option value="2">每 2 分鐘</option>
              <option value="5">每 5 分鐘</option>
            </select>
          </label>

          <label class="field">
            <span>工具列圖示顯示</span>
            <select id="badge-key"></select>
          </label>
        </div>

        <div class="toggles">
          <label class="toggle">
            <input type="checkbox" id="sound" />
            <span>通知音效<em class="muted small">　跳通知時播放提示音</em></span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="require-interaction" />
            <span
              >通知不自動消失<em class="muted small"
                >　需手動關閉，較不會錯過</em
              ></span
            >
          </label>
          <label class="toggle">
            <input type="checkbox" id="badge-enabled" />
            <span
              >在工具列圖示上顯示目前號碼<em class="muted small"
                >　不用點開就看得到</em
              ></span
            >
          </label>
        </div>

        <div class="row-actions">
          <button id="btn-test">發送測試通知</button>
          <span class="muted small">
            若沒看到通知，請到系統的「通知」設定確認 Chrome 已被允許顯示通知。
          </span>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2 style="margin: 0">選擇要監看的診間</h2>
          <div class="filters">
            <div class="tabs" id="shift-tabs"></div>
            <input type="search" id="search" placeholder="搜尋科別、診間或醫師" />
          </div>
        </div>
        <p class="muted small" id="list-note">正在抓取今日診間清單…</p>
        <div id="clinic-list"></div>
      </section>

      <section class="card" id="orphan-card" hidden>
        <h2>監看中（今日班表未出現）</h2>
        <p class="muted small">
          這些設定會保留，等該診間再次出現在班表上就會自動恢復監看。
        </p>
        <div id="orphan-list"></div>
      </section>

      <div class="spacer"></div>
    </div>

    <footer class="bar">
      <div class="bar-inner">
        <span id="status" class="muted small"></span>
        <div class="bar-actions">
          <button id="btn-reset" title="把上方的通知與更新設定帶回預設值，已監看的診間不受影響">
            恢復預設值
          </button>
          <button id="btn-save" class="primary">儲存設定</button>
        </div>
      </div>
    </footer>

    <script type="module" src="options.js"></script>
  </body>
</html>
